
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Comparison</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>String Comparison</h1>
    <p class="subtitle">Experiment No. 04 | JavaScript</p>

    <label for="str1">First String</label>
    <input type="text" id="str1" placeholder="Enter first string">

    <label for="str2">Second String</label>
    <input type="text" id="str2" placeholder="Enter second string">

    <div class="buttons">
        <button id="compareBtn">Compare</button>
        <button id="resetBtn" class="reset">Reset</button>
    </div>

    <div id="result" aria-live="polite"></div>
</div>

<script src="script.js"></script>
</body>
</html>
